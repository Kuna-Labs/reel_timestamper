<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reel Marker</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reel Marker">
<meta name="theme-color" content="#1c1c1e">
<style>
  :root {
    --bg: #f2f2f4;
    --surface: #ffffff;
    --line: #dcdce0;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --rec: #e0242f;
    --rec-press: #b51b24;
    --on-rec: #ffffff;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618;
      --surface: #232326;
      --line: #36363a;
      --text: #f4f4f6;
      --muted: #9a9aa0;
      --rec: #ff3b45;
      --rec-press: #d22a33;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
  }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 8px 0 20px; }
  h2 { font-size: 20px; font-weight: 650; margin: 28px 0 10px; }
  [hidden] { display: none !important; }

  .panel { background: var(--surface); border-radius: 14px; padding: 16px; }
  label.field { display: block; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
  label.field span { display: block; margin-bottom: 6px; }
  input[type="text"], input[inputmode] {
    width: 100%;
    font: inherit;
    font-size: 17px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
  }
  input:focus { outline: 2px solid var(--rec); outline-offset: 1px; }
  .tc { font-variant-numeric: tabular-nums; }

  button {
    font: inherit;
    border: 0;
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 2px solid var(--rec); outline-offset: 2px; }
  .primary { width: 100%; background: var(--rec); color: var(--on-rec); font-weight: 650; font-size: 18px; }
  .primary:active { background: var(--rec-press); }
  .quiet { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  .danger { background: transparent; color: var(--rec); border: 1px solid var(--line); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > button { flex: 1 1 auto; }

  /* Live view */
  .live-title { font-size: 15px; color: var(--muted); margin: 0 0 4px; overflow-wrap: anywhere; }
  .clock { font-size: 56px; font-weight: 300; letter-spacing: -0.02em; margin: 0 0 18px; line-height: 1; }
  #markBtn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: min(42vh, 360px);
    border-radius: 28px;
    background: var(--rec);
    color: var(--on-rec);
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.01em;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 0.08s ease;
  }
  #markBtn small { font-size: 16px; font-weight: 500; opacity: 0.85; margin-top: 6px; }
  #markBtn:active { transform: scale(0.97); background: var(--rec-press); }
  #markBtn.flash { animation: flash 0.35s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 var(--rec); } 100% { box-shadow: 0 0 0 18px transparent; } }
  .stop-row { margin-top: 12px; }

  /* Marks */
  .marks { list-style: none; margin: 0; padding: 0; }
  .mark {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .mark:last-child { border-bottom: 0; }
  .mark .time { font-weight: 600; font-size: 17px; }
  .mark input { padding: 8px 10px; font-size: 16px; }
  .mark .del { background: transparent; color: var(--muted); padding: 8px 10px; font-size: 20px; line-height: 1; }
  .empty { color: var(--muted); margin: 4px 0; }

  /* History */
  .sessions { list-style: none; margin: 0; padding: 0; }
  .sessions button {
    width: 100%;
    text-align: left;
    background: var(--surface);
    color: var(--text);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .sessions .meta { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .sessions .name { overflow-wrap: anywhere; }

  .detail-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .detail-head h2 { overflow-wrap: anywhere; }
  .detail-sub { color: var(--muted); font-size: 14px; margin: -6px 0 12px; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 15px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  #toast.show { opacity: 1; }
  .haptic { position: absolute; left: -9999px; }

  @media (prefers-reduced-motion: reduce) {
    #markBtn, #markBtn.flash { transition: none; animation: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Reel Marker</h1>

  <!-- Setup -->
  <section id="setup" class="panel">
    <label class="field"><span>Video title</span>
      <input id="title" type="text" placeholder="Episode 42 – full recording" autocomplete="off">
    </label>
    <label class="field"><span>Start offset (HH:MM:SS)</span>
      <input id="offset" inputmode="numeric" class="tc" placeholder="00:00:00" autocomplete="off">
    </label>
    <button id="startBtn" class="primary">Start</button>
  </section>

  <!-- Live -->
  <section id="live" hidden>
    <p class="live-title" id="liveTitle"></p>
    <p class="clock tc" id="clock">00:00:00</p>
    <button id="markBtn">Mark<small id="markCount">No marks yet</small></button>
    <div class="row stop-row">
      <button id="stopBtn" class="quiet">Stop session</button>
    </div>
  </section>

  <!-- Marks for the live or selected session -->
  <section id="detail" hidden>
    <div class="detail-head">
      <h2 id="detailTitle">Marks</h2>
    </div>
    <p class="detail-sub" id="detailSub"></p>
    <div class="panel">
      <ul class="marks" id="marks"></ul>
    </div>
    <div class="row" id="detailActions" style="margin-top:12px">
      <button id="shareBtn" class="quiet">Share CSV</button>
      <button id="copyBtn" class="quiet">Copy list</button>
      <button id="deleteBtn" class="danger">Delete</button>
      <button id="closeBtn" class="quiet">Close</button>
    </div>
  </section>

  <!-- History -->
  <section id="history" hidden>
    <h2>Past sessions</h2>
    <ul class="sessions" id="sessions"></ul>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<!-- iOS 18+ haptic trick: toggling a switch input produces a tap -->
<label class="haptic" id="hapticLbl" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

<script>
(() => {
  const KEY = 'reelmarker.v1';
  const $ = id => document.getElementById(id);

  let db = load();
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && Array.isArray(d.sessions)) return d;
    } catch (e) {}
    return { sessions: [], activeId: null, viewId: null };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) { toast('Couldn’t save — storage is full or blocked'); }
  }

  const active = () => db.sessions.find(s => s.id === db.activeId) || null;
  const viewed = () => db.sessions.find(s => s.id === (db.activeId || db.viewId)) || null;

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
  }
  function parseTC(str) {
    str = (str || '').trim();
    if (!str) return 0;
    const parts = str.split(/[:.\s]/).filter(Boolean).map(Number);
    if (!parts.length || parts.length > 3 || parts.some(n => !Number.isFinite(n) || n < 0)) return null;
    return parts.reduce((acc, n) => acc * 60 + n, 0);
  }
  const markTC = (s, m) => fmt(s.offset + m.ms / 1000);
  const sorted = s => s.marks.slice().sort((a, b) => a.ms - b.ms);
  const esc = str => String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  function buzz() {
    if (navigator.vibrate) navigator.vibrate(30);
    else $('hapticLbl').click();
    const b = $('markBtn');
    b.classList.remove('flash');
    void b.offsetWidth;
    b.classList.add('flash');
  }

  // Keep the screen awake while recording
  let lock = null;
  async function keepAwake() {
    if (!active() || !('wakeLock' in navigator)) return;
    try { lock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  function releaseAwake() {
    try { if (lock) lock.release(); } catch (e) {}
    lock = null;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { keepAwake(); tick(); }
  });

  // Clock
  function tick() {
    const s = active();
    if (s) $('clock').textContent = fmt(s.offset + (Date.now() - s.startedAt) / 1000);
  }
  setInterval(tick, 250);

  // Actions
  $('startBtn').addEventListener('click', () => {
    const title = $('title').value.trim() || 'Untitled';
    const offset = parseTC($('offset').value);
    if (offset === null) { toast('Enter the offset as HH:MM:SS'); $('offset').focus(); return; }
    const s = { id: Date.now().toString(36), title, offset, startedAt: Date.now(), endedAt: null, marks: [] };
    db.sessions.unshift(s);
    db.activeId = s.id;
    db.viewId = s.id;
    save();
    $('title').value = '';
    $('offset').value = '';
    keepAwake();
    render();
  });

  $('markBtn').addEventListener('click', () => {
    const s = active();
    if (!s) return;
    const m = { ms: Date.now() - s.startedAt, note: '' };
    s.marks.push(m);
    save();
    buzz();
    renderMarks();
    toast('Marked ' + markTC(s, m));
  });

  $('stopBtn').addEventListener('click', () => {
    const s = active();
    if (!s || !confirm('Stop this session?')) return;
    s.endedAt = Date.now();
    db.activeId = null;
    db.viewId = s.id;
    save();
    releaseAwake();
    render();
  });

  $('shareBtn').addEventListener('click', async () => {
    const s = viewed();
    if (!s) return;
    const name = (s.title.replace(/[^\w\- ]+/g, '').trim() || 'reel-marks') + '.csv';
    const file = new File([toCSV(s)], name, { type: 'text/csv' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: s.title }); } catch (e) {}
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $('copyBtn').addEventListener('click', async () => {
    const s = viewed();
    if (!s) return;
    const text = s.title + '\n' + sorted(s).map(m => markTC(s, m) + (m.note ? ' – ' + m.note : '')).join('\n');
    try { await navigator.clipboard.writeText(text); toast('Copied'); }
    catch (e) { toast('Couldn’t copy — try Share CSV'); }
  });

  $('deleteBtn').addEventListener('click', () => {
    const s = viewed();
    if (!s || !confirm('Delete “' + s.title + '” and all its marks?')) return;
    db.sessions = db.sessions.filter(x => x.id !== s.id);
    db.viewId = null;
    save();
    render();
    toast('Deleted');
  });

  $('closeBtn').addEventListener('click', () => { db.viewId = null; save(); render(); });

  function toCSV(s) {
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const rows = [['Title', 'Mark', 'Timecode', 'Note']];
    sorted(s).forEach((m, i) => rows.push([s.title, i + 1, markTC(s, m), m.note]));
    return rows.map(r => r.map(q).join(',')).join('\r\n');
  }

  // Rendering
  function renderMarks() {
    const s = viewed();
    if (!s) return;
    const list = $('marks');
    const n = s.marks.length;
    $('markCount').textContent = n ? (n === 1 ? '1 mark' : n + ' marks') : 'No marks yet';
    if (!n) {
      list.innerHTML = '<li class="empty">' + (db.activeId ? 'Tap Mark whenever you hear a reel moment.' : 'This session has no marks.') + '</li>';
      return;
    }
    // Newest first while live so you can add a note right away; chronological otherwise
    const ordered = db.activeId ? sorted(s).reverse() : sorted(s);
    list.innerHTML = ordered.map(m => {
      const idx = s.marks.indexOf(m);
      return '<li class="mark">' +
        '<span class="time tc">' + markTC(s, m) + '</span>' +
        '<input type="text" data-i="' + idx + '" value="' + esc(m.note) + '" placeholder="Note (optional)" aria-label="Note for ' + markTC(s, m) + '">' +
        '<button class="del" data-del="' + idx + '" aria-label="Delete mark ' + markTC(s, m) + '">×</button>' +
      '</li>';
    }).join('');
  }

  $('marks').addEventListener('input', e => {
    const i = e.target.dataset.i;
    const s = viewed();
    if (i == null || !s || !s.marks[i]) return;
    s.marks[i].note = e.target.value;
    save();
  });
  $('marks').addEventListener('click', e => {
    const i = e.target.dataset.del;
    const s = viewed();
    if (i == null || !s || !s.marks[i]) return;
    if (!confirm('Delete the mark at ' + markTC(s, s.marks[i]) + '?')) return;
    s.marks.splice(Number(i), 1);
    save();
    renderMarks();
  });

  function renderHistory() {
    const past = db.sessions.filter(s => s.id !== db.activeId && s.id !== db.viewId);
    $('history').hidden = !!db.activeId || !past.length;
    $('sessions').innerHTML = past.map(s => {
      const d = new Date(s.startedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      const n = s.marks.length;
      return '<li><button data-open="' + s.id + '"><span class="name">' + esc(s.title) + '</span>' +
        '<span class="meta">' + d + ', ' + n + (n === 1 ? ' mark' : ' marks') + '</span></button></li>';
    }).join('');
  }
  $('sessions').addEventListener('click', e => {
    const btn = e.target.closest('[data-open]');
    if (!btn) return;
    db.viewId = btn.dataset.open;
    save();
    render();
    $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  function render() {
    const live = active();
    const s = viewed();
    $('setup').hidden = !!live;
    $('live').hidden = !live;
    $('detail').hidden = !s;
    $('detailActions').hidden = !!live;
    if (live) {
      $('liveTitle').textContent = live.title + (live.offset ? ' (started at ' + fmt(live.offset) + ')' : '');
      tick();
    }
    if (s) {
      $('detailTitle').textContent = live ? 'Marks' : s.title;
      $('detailSub').textContent = live ? '' :
        new Date(s.startedAt).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) +
        (s.offset ? ', offset ' + fmt(s.offset) : '');
      $('detailSub').hidden = !!live;
    }
    renderMarks();
    renderHistory();
  }

  render();
  keepAwake();
})();
</script>
</body>
</html>
