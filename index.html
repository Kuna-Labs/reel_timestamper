<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reel Marker</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reel Marker">
<meta name="theme-color" content="#1c1c1e">
<style>
  :root {
    --bg: #f2f2f4;
    --surface: #ffffff;
    --line: #dcdce0;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --rec: #e0242f;
    --rec-press: #b51b24;
    --on-rec: #ffffff;
    --scrim: rgba(0, 0, 0, 0.35);
    --stage-bg: #000000;
    --stage-text: #ffffff;
    --stage-muted: #8e8e93;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618;
      --surface: #232326;
      --line: #36363a;
      --text: #f4f4f6;
      --muted: #9a9aa0;
      --rec: #ff3b45;
      --rec-press: #d22a33;
      --scrim: rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--bg);
  }
  [hidden] { display: none !important; }
  .tc { font-variant-numeric: tabular-nums; }

  /* Top bar */
  .bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    display: grid;
    grid-template-columns: 48px 1fr 48px;
    align-items: center;
    gap: 8px;
    padding: 6px max(8px, env(safe-area-inset-right)) 6px max(8px, env(safe-area-inset-left));
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .bar h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 650;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .icon-btn {
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 22px;
    background: transparent;
    color: var(--text);
    font-size: 24px;
    line-height: 1;
  }
  .icon-btn:active { background: var(--surface); }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
  }
  h2 { font-size: 20px; font-weight: 650; margin: 24px 0 10px; }

  .panel { background: var(--surface); border-radius: 14px; padding: 16px; }
  label.field { display: block; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
  label.field span { display: block; margin-bottom: 6px; }
  input[type="text"], input[inputmode] {
    width: 100%;
    font: inherit;
    font-size: 17px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
  }
  input:focus { outline: 2px solid var(--rec); outline-offset: 1px; }
  .hint { font-size: 14px; color: var(--muted); margin: 0 0 12px; }

  button {
    font: inherit;
    border: 0;
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 2px solid var(--rec); outline-offset: 2px; }
  .primary { width: 100%; background: var(--rec); color: var(--on-rec); font-weight: 650; font-size: 18px; }
  .primary:active { background: var(--rec-press); }
  .quiet { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  .danger { background: transparent; color: var(--rec); border: 1px solid var(--line); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > button { flex: 1 1 auto; }

  /* Live */
  .live-title { font-size: 15px; color: var(--muted); margin: 0 0 4px; overflow-wrap: anywhere; }
  .clock { font-size: 56px; font-weight: 300; letter-spacing: -0.02em; margin: 0 0 18px; line-height: 1; }
  #markBtn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: min(42vh, 360px);
    border-radius: 28px;
    background: var(--rec);
    color: var(--on-rec);
    font-size: 40px;
    font-weight: 700;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 0.08s ease;
  }
  #markBtn small { font-size: 16px; font-weight: 500; opacity: 0.85; margin-top: 6px; }
  #markBtn:active { transform: scale(0.97); background: var(--rec-press); }
  #markBtn.flash { animation: ring 0.35s ease-out; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 var(--rec); } 100% { box-shadow: 0 0 0 18px transparent; } }
  .end-row { margin-top: 12px; }

  /* Marks */
  .marks { list-style: none; margin: 0; padding: 0; }
  .mark {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .mark:last-child { border-bottom: 0; }
  .mark .time { font-weight: 600; }
  .mark input { padding: 8px 10px; font-size: 16px; }
  .mark .del { background: transparent; color: var(--muted); padding: 8px 10px; font-size: 20px; line-height: 1; }
  .empty { color: var(--muted); margin: 4px 0; }
  .detail-sub { color: var(--muted); font-size: 14px; margin: 8px 0 16px; }
  #renameInput { font-size: 20px; font-weight: 650; background: transparent; border-color: transparent; padding: 8px 10px; margin-left: -10px; }
  #renameInput:focus { background: var(--surface); border-color: var(--line); }

  /* Drawer */
  #scrim {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: var(--scrim);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  #drawer {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 21;
    width: min(320px, 86vw);
    background: var(--bg);
    border-right: 1px solid var(--line);
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left));
  }
  body.drawer-open #drawer { transform: none; }
  body.drawer-open #scrim { opacity: 1; pointer-events: auto; }
  #drawer .primary { margin-bottom: 14px; }
  .episodes { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  .episodes button {
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--text);
    padding: 10px 12px;
    margin-bottom: 2px;
    border-radius: 10px;
  }
  .episodes button[aria-current="true"] { background: var(--surface); }
  .episodes .name { display: block; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .episodes .meta { display: block; font-size: 13px; color: var(--muted); }
  .episodes .live-dot { color: var(--rec); font-weight: 600; }
  .drawer-empty { color: var(--muted); font-size: 15px; padding: 0 12px; }

  /* Landscape stage: big timecode for the room */
  #stage {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--stage-bg);
    color: var(--stage-text);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #stageClock { font-size: min(21vw, 64vh); font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
  #stageTitle { font-size: 18px; color: var(--stage-muted); margin-bottom: 2vh; max-width: 80vw; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stageInfo { font-size: 16px; color: var(--stage-muted); margin-top: 3vh; display: flex; align-items: center; gap: 8px; }
  .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  #stage.flash { animation: stageflash 0.4s ease-out; }
  @keyframes stageflash { 0% { background: var(--rec); } 100% { background: var(--stage-bg); } }

  @media (orientation: landscape) and (max-height: 600px) {
    body.is-live #stage { display: flex; }
    body.is-live .bar, body.is-live main, body.is-live #drawer, body.is-live #scrim { display: none; }
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 60;
    background: var(--text);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 15px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  #toast.show { opacity: 1; }
  .haptic { position: absolute; left: -9999px; }

  @media (prefers-reduced-motion: reduce) {
    #markBtn, #drawer, #scrim { transition: none; }
    #markBtn.flash, #stage.flash, .rec-dot { animation: none; }
  }
</style>
</head>
<body>
<header class="bar">
  <button class="icon-btn" id="menuBtn" aria-label="Show episodes">☰</button>
  <h1 id="barTitle">Reel Marker</h1>
  <button class="icon-btn" id="newBtn" aria-label="New episode">＋</button>
</header>

<div id="scrim"></div>
<nav id="drawer" aria-label="Episodes">
  <button class="primary" id="drawerNewBtn">New episode</button>
  <ul class="episodes" id="episodes"></ul>
</nav>

<main>
  <!-- New episode -->
  <section id="setup" class="panel">
    <label class="field"><span>Episode title</span>
      <input id="title" type="text" placeholder="Episode 42 – full recording" autocomplete="off">
    </label>
    <label class="field"><span>Start offset (HH:MM:SS)</span>
      <input id="offset" inputmode="numeric" class="tc" placeholder="00:00:00" autocomplete="off">
    </label>
    <p class="hint" id="setupHint" hidden></p>
    <button id="startBtn" class="primary">Start</button>
  </section>

  <!-- Live -->
  <section id="live" hidden>
    <p class="live-title" id="liveTitle"></p>
    <p class="clock tc" id="clock">00:00:00</p>
    <button id="markBtn">Mark<small id="markCount">No marks yet</small></button>
    <div class="row end-row">
      <button id="endBtn" class="quiet">End recording</button>
    </div>
  </section>

  <!-- Marks for the live or selected episode -->
  <section id="detail" hidden>
    <div id="pastHead">
      <input id="renameInput" type="text" aria-label="Episode title" autocomplete="off">
      <p class="detail-sub" id="detailSub"></p>
    </div>
    <h2 id="liveMarksHead">Marks</h2>
    <div class="panel">
      <ul class="marks" id="marks"></ul>
    </div>
    <div class="row" id="detailActions" style="margin-top:12px">
      <button id="shareBtn" class="quiet">Share CSV</button>
      <button id="copyBtn" class="quiet">Copy list</button>
      <button id="deleteBtn" class="danger">Delete episode</button>
    </div>
  </section>
</main>

<!-- Shown full screen when the phone is turned sideways during a recording -->
<div id="stage" aria-live="off">
  <div id="stageTitle"></div>
  <div id="stageClock" class="tc">00:00:00</div>
  <div id="stageInfo"><span class="rec-dot"></span><span id="stageCount">0 marks</span></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<!-- iOS 18+ haptic trick: toggling a switch input produces a tap -->
<label class="haptic" id="hapticLbl" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

<script>
(() => {
  const KEY = 'reelmarker.v1';
  const $ = id => document.getElementById(id);

  // ---------- Storage ----------
  let db = load();
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && Array.isArray(d.sessions)) return d;
    } catch (e) {}
    return { sessions: [], activeId: null, viewId: null };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) { toast('Couldn’t save — storage is full or blocked'); }
  }

  const find = id => db.sessions.find(s => s.id === id) || null;
  const active = () => find(db.activeId);
  const viewed = () => (db.viewId === 'new' ? null : find(db.viewId) || active());
  function screen() {
    if (db.viewId === 'new') return 'new';
    const s = viewed();
    if (!s) return 'new';
    return s.id === db.activeId ? 'live' : 'past';
  }

  // ---------- Helpers ----------
  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
  }
  function parseTC(str) {
    str = (str || '').trim();
    if (!str) return 0;
    const parts = str.split(/[:.\s]/).filter(Boolean).map(Number);
    if (!parts.length || parts.length > 3 || parts.some(n => !Number.isFinite(n) || n < 0)) return null;
    return parts.reduce((acc, n) => acc * 60 + n, 0);
  }
  const markTC = (s, m) => fmt(s.offset + m.ms / 1000);
  const sorted = s => s.marks.slice().sort((a, b) => a.ms - b.ms);
  const plural = n => n === 1 ? '1 mark' : n + ' marks';
  const esc = str => String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }
  function restartAnim(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }
  function buzz() {
    if (navigator.vibrate) navigator.vibrate(30);
    else $('hapticLbl').click();
  }

  // ---------- Keep screen awake while recording ----------
  let lock = null;
  async function keepAwake() {
    if (!active() || !('wakeLock' in navigator)) return;
    try { lock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  function releaseAwake() {
    try { if (lock) lock.release(); } catch (e) {}
    lock = null;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { keepAwake(); tick(); }
  });

  // ---------- Clock ----------
  function tick() {
    const s = active();
    if (!s) return;
    const t = fmt(s.offset + (Date.now() - s.startedAt) / 1000);
    $('clock').textContent = t;
    $('stageClock').textContent = t;
  }
  setInterval(tick, 250);

  // ---------- Drawer ----------
  const openDrawer = () => { renderDrawer(); document.body.classList.add('drawer-open'); };
  const closeDrawer = () => document.body.classList.remove('drawer-open');
  $('menuBtn').addEventListener('click', openDrawer);
  $('scrim').addEventListener('click', closeDrawer);

  function goNew() {
    db.viewId = 'new';
    save();
    closeDrawer();
    render();
    $('title').focus();
  }
  $('newBtn').addEventListener('click', goNew);
  $('drawerNewBtn').addEventListener('click', goNew);

  $('episodes').addEventListener('click', e => {
    const btn = e.target.closest('[data-open]');
    if (!btn) return;
    db.viewId = btn.dataset.open;
    save();
    closeDrawer();
    render();
    window.scrollTo(0, 0);
  });

  // ---------- Recording ----------
  $('startBtn').addEventListener('click', () => {
    const title = $('title').value.trim() || 'Untitled episode';
    const offset = parseTC($('offset').value);
    if (offset === null) { toast('Enter the offset as HH:MM:SS'); $('offset').focus(); return; }
    // Starting a new episode ends whatever was recording; it stays in the list
    const prev = active();
    if (prev) prev.endedAt = Date.now();
    const s = { id: Date.now().toString(36), title, offset, startedAt: Date.now(), endedAt: null, marks: [] };
    db.sessions.unshift(s);
    db.activeId = s.id;
    db.viewId = s.id;
    save();
    $('title').value = '';
    $('offset').value = '';
    keepAwake();
    render();
    if (prev) toast('Ended “' + prev.title + '”');
  });

  function addMark() {
    const s = active();
    if (!s) return;
    const m = { ms: Date.now() - s.startedAt, note: '' };
    s.marks.push(m);
    save();
    buzz();
    restartAnim($('markBtn'), 'flash');
    restartAnim($('stage'), 'flash');
    renderMarks();
    renderStage();
    toast('Marked ' + markTC(s, m));
  }
  $('markBtn').addEventListener('click', addMark);
  $('stage').addEventListener('click', addMark);

  $('endBtn').addEventListener('click', () => {
    const s = active();
    if (!s || !confirm('End the recording of “' + s.title + '”?')) return;
    s.endedAt = Date.now();
    db.activeId = null;
    db.viewId = s.id;
    save();
    releaseAwake();
    render();
  });

  // ---------- Past episode actions ----------
  $('renameInput').addEventListener('input', e => {
    const s = viewed();
    if (!s) return;
    s.title = e.target.value.trim() || 'Untitled episode';
    save();
    $('barTitle').textContent = s.title;
  });

  $('shareBtn').addEventListener('click', async () => {
    const s = viewed();
    if (!s) return;
    const name = (s.title.replace(/[^\w\- ]+/g, '').trim() || 'reel-marks') + '.csv';
    const file = new File([toCSV(s)], name, { type: 'text/csv' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: s.title }); } catch (e) {}
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $('copyBtn').addEventListener('click', async () => {
    const s = viewed();
    if (!s) return;
    const text = s.title + '\n' + sorted(s).map(m => markTC(s, m) + (m.note ? ' – ' + m.note : '')).join('\n');
    try { await navigator.clipboard.writeText(text); toast('Copied'); }
    catch (e) { toast('Couldn’t copy — try Share CSV'); }
  });

  $('deleteBtn').addEventListener('click', () => {
    const s = viewed();
    if (!s || !confirm('Delete “' + s.title + '” and all its marks? This can’t be undone.')) return;
    db.sessions = db.sessions.filter(x => x.id !== s.id);
    db.viewId = null;
    save();
    render();
    toast('Deleted');
  });

  function toCSV(s) {
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const rows = [['Title', 'Mark', 'Timecode', 'Note']];
    sorted(s).forEach((m, i) => rows.push([s.title, i + 1, markTC(s, m), m.note]));
    return rows.map(r => r.map(q).join(',')).join('\r\n');
  }

  // ---------- Marks list ----------
  $('marks').addEventListener('input', e => {
    const i = e.target.dataset.i;
    const s = viewed();
    if (i == null || !s || !s.marks[i]) return;
    s.marks[i].note = e.target.value;
    save();
  });
  $('marks').addEventListener('click', e => {
    const i = e.target.dataset.del;
    const s = viewed();
    if (i == null || !s || !s.marks[i]) return;
    if (!confirm('Delete the mark at ' + markTC(s, s.marks[i]) + '?')) return;
    s.marks.splice(Number(i), 1);
    save();
    renderMarks();
    renderStage();
  });

  // ---------- Rendering ----------
  function renderMarks() {
    const s = viewed();
    const list = $('marks');
    if (!s) { list.innerHTML = ''; return; }
    const isLive = s.id === db.activeId;
    const n = s.marks.length;
    $('markCount').textContent = n ? plural(n) : 'No marks yet';
    if (!n) {
      list.innerHTML = '<li class="empty">' + (isLive ? 'Tap Mark whenever you hear a reel moment.' : 'This episode has no marks.') + '</li>';
      return;
    }
    // Newest first while recording so you can add a note right away
    const ordered = isLive ? sorted(s).reverse() : sorted(s);
    list.innerHTML = ordered.map(m => {
      const idx = s.marks.indexOf(m);
      const tc = markTC(s, m);
      return '<li class="mark">' +
        '<span class="time tc">' + tc + '</span>' +
        '<input type="text" data-i="' + idx + '" value="' + esc(m.note) + '" placeholder="Note (optional)" aria-label="Note for ' + tc + '">' +
        '<button class="del" data-del="' + idx + '" aria-label="Delete mark ' + tc + '">×</button>' +
      '</li>';
    }).join('');
  }

  function renderStage() {
    const s = active();
    document.body.classList.toggle('is-live', !!s);
    if (!s) return;
    $('stageTitle').textContent = s.title;
    $('stageCount').textContent = plural(s.marks.length) + ' · tap anywhere to mark';
    tick();
  }

  function renderDrawer() {
    const list = $('episodes');
    if (!db.sessions.length) {
      list.innerHTML = '<li class="drawer-empty">Episodes you record show up here.</li>';
      return;
    }
    const current = screen() === 'new' ? null : (viewed() || {}).id;
    list.innerHTML = db.sessions
      .slice()
      .sort((a, b) => b.startedAt - a.startedAt)
      .map(s => {
        const isLive = s.id === db.activeId;
        const date = new Date(s.startedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        const meta = isLive
          ? '<span class="live-dot">● Recording</span>, ' + plural(s.marks.length)
          : date + ', ' + plural(s.marks.length);
        return '<li><button data-open="' + s.id + '"' + (s.id === current ? ' aria-current="true"' : '') + '>' +
          '<span class="name">' + esc(s.title) + '</span><span class="meta">' + meta + '</span></button></li>';
      }).join('');
  }

  function render() {
    const sc = screen();
    const s = viewed();
    const live = active();

    $('setup').hidden = sc !== 'new';
    $('live').hidden = sc !== 'live';
    $('detail').hidden = sc === 'new';
    $('pastHead').hidden = sc !== 'past';
    $('liveMarksHead').hidden = sc !== 'live';
    $('detailActions').hidden = sc !== 'past';

    $('barTitle').textContent = sc === 'new' ? 'New episode' : s.title;

    $('setupHint').hidden = !live;
    if (live) $('setupHint').textContent = 'Starting will end the recording of “' + live.title + '”. It stays in your episodes.';

    if (sc === 'live') {
      $('liveTitle').textContent = s.offset ? 'Started at ' + fmt(s.offset) : 'Recording';
    }
    if (sc === 'past') {
      $('renameInput').value = s.title;
      const started = new Date(s.startedAt).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
      $('detailSub').textContent = started + (s.offset ? ', offset ' + fmt(s.offset) : '');
    }

    renderMarks();
    renderStage();
    renderDrawer();
  }

  render();
  keepAwake();
})();
</script>
</body>
</html>
